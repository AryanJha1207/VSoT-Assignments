<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1 class="heading">Task Filter App</h1>
        <div class="input-sec">
            <input type="text" placeholder="Enter Your Task" class="input">
            <button class="add">ADD TASK</button>
        </div>
        <div class="buttons">
            <button>ALL</button>
            <button>COMPLETED</button>
            <button>PENDING</button>
        </div> 
        <div class="info">
            <h4>Total: <span class="all">0</span> | Completed: <span class="comp">0</span></h4>
        </div>
        <div class="tasks">
        </div>   
        
    </div>
</body>
<script src="script.js"></script>
</html>
